name: Deploy static site to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Synchronize static site mirror
        run: node .github/scripts/sync-public.mjs
      - name: Deploy static files to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a40b8466753962ea417bf20622b1292
          command: pages deploy public --project-name=kxxweb-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
