name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a40b8466753962ea417bf20622b1292
          command: pages deploy . --project-name=skxx-web-github-io --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach kxxweb.ru custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7a40b8466753962ea417bf20622b1292
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/skxx-web-github-io/domains" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"kxxweb.ru"}'
