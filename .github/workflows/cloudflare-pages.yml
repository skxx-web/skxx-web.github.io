name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a40b8466753962ea417bf20622b1292
          command: pages deploy . --project-name=skxx-web-github-io --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy mobile-safe edge proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7a40b8466753962ea417bf20622b1292
        run: |
          npx --yes wrangler@latest deploy cloudflare-kxxweb-proxy.js \
            --name kxxweb-edge \
            --compatibility-date=2026-10-26 \
            --routes 'kxxweb.ru/*' \
            --experimental-route-zones \
            --zone kxxweb.ru
      - name: Provision kxxweb.ru DNS zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7a40b8466753962ea417bf20622b1292
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl --fail-with-body --silent --show-error "${api}/zones?name=kxxweb.ru" "${auth[@]}")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            created=$(curl --fail-with-body --silent --show-error \
              --request POST "${api}/zones" "${auth[@]}" \
              --data "{\"name\":\"kxxweb.ru\",\"account\":{\"id\":\"${CLOUDFLARE_ACCOUNT_ID}\"}}")
            zone_id=$(printf '%s' "$created" | jq -r '.result.id // empty')
            zones="$created"
          fi
          test -n "$zone_id"
          printf '%s\n' "$zones" | jq -r '.result[0].name_servers[]? // empty' | sed 's/^/Cloudflare nameserver: /'
          records=$(curl --fail-with-body --silent --show-error "${api}/zones/${zone_id}/dns_records?name=kxxweb.ru" "${auth[@]}")
          printf '%s' "$records" | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' | while read -r record_id; do
            [ -z "$record_id" ] || curl --fail-with-body --silent --show-error \
              --request DELETE "${api}/zones/${zone_id}/dns_records/${record_id}" "${auth[@]}" >/dev/null
          done
          curl --fail-with-body --silent --show-error \
            --request POST "${api}/zones/${zone_id}/dns_records" "${auth[@]}" \
            --data '{"type":"CNAME","name":"kxxweb.ru","content":"skxx-web-github-io.pages.dev","ttl":1,"proxied":true}' >/dev/null
      - name: Attach kxxweb.ru custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7a40b8466753962ea417bf20622b1292
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          domains=$(curl --fail-with-body --silent --show-error \
            "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/skxx-web-github-io/domains" "${auth[@]}")
          if ! printf '%s' "$domains" | jq -e '.result[]? | select(.name == "kxxweb.ru")' >/dev/null; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/skxx-web-github-io/domains" \
              "${auth[@]}" \
              --data '{"name":"kxxweb.ru"}'
          fi
